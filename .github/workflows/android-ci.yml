name: Android CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Test and build debug APK
        run: bash gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

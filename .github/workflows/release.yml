name: Signed Android release

on:
  push:
    branches: [main]
    paths: [release-version.txt]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v1.0.1)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK
        run: |
          SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDKMANAGER" 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing RELEASE_KEYSTORE_BASE64'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Fetch verified native Xray runtime
        run: bash scripts/fetch-libxray-android.sh
      - name: Build, test and stage standalone APKs
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" && test -s "$KEYSTORE_PATH"
          bash gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk app-release.apk
          bash gradlew --no-daemon -PtargetAbi=arm64-v8a :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk arm64-v8a.apk
      - name: Verify packaging, signatures and checksums
        run: |
          python3 scripts/check-apk.py arm64-v8a.apk arm64-v8a
          python3 scripts/check-apk.py app-release.apk universal
          for apk in arm64-v8a.apk app-release.apk; do
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          done
          sha256sum arm64-v8a.apk app-release.apk > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 install and launch checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            curl --fail --location --retry 3 -o previous.apk https://github.com/drfxai/MaximusVPN/releases/download/v1.0.3/app-release.apk
            bash scripts/install-smoke.sh previous.apk
            bash scripts/install-smoke.sh app-release.apk
            if adb shell getprop ro.product.cpu.abilist | grep -q arm64-v8a; then bash scripts/install-smoke.sh arm64-v8a.apk; else echo "ARM64 install requires a physical ARM64 device"; fi
      - name: Preserve installation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-install-diagnostics
          path: /tmp/maximus-*.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then RELEASE_TAG=$(cat release-version.txt); fi
          case "$RELEASE_TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo 'Expected semver tag such as v1.0.1'; exit 1 ;; esac
          gh release create "$RELEASE_TAG" arm64-v8a.apk app-release.apk SHA256SUMS --target "$GITHUB_SHA" --title "Maximus VPN $RELEASE_TAG" --notes "Signed Android APKs: arm64-v8a.apk for ARM64 devices and app-release.apk for other supported devices. Verify downloads with SHA256SUMS."
